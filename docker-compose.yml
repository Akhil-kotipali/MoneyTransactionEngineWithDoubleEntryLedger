version: '3.8'

services:
  app:
    build: .
    container_name: paymoneytoday-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/testdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAVA_OPTS=-XX:+UseSerialGC -Xss256k -Xms64m -Xmx256m -XX:MaxRAM=400m
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 350M

  redis:
    image: redis:7-alpine
    container_name: paymoneytoday-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "25mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 40M

  db:
    image: mysql:8.0-debian
    container_name: paymoneytoday-mysql
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=30"]
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 200M
